<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/blocks.css">
    <link rel="stylesheet" href="style/blocks-input.css">
    <title>CodeBlock</title>
</head>
<body>
    <main>
        <h1>
            <span style="color: #ffffff;">Code</span
            ><span style="color: #ff033e;">B</span
            ><span style="color: yellow;">l</span
            ><span style="color: greenyellow;">o</span
            ><span style="color: dodgerblue;">c</span
            ><span style="color: #cd00cd;">k</span>
        </h1>
        <section class="code">
        <section class="blockPanel">
            <h2>Конструктор алгоритмов</h2>
            <button class="blockPanelButton" data-type="start">Старт</button>
            <button class="blockPanelButton" data-type="input">Ввод</button>
            <button class="blockPanelButton" data-type="print">Вывод</button>
            <button class="blockPanelButton" data-type="variableInit">Объявить переменную</button>
            <button class="blockPanelButton" data-type="assignValue">Присваивание</button>
            <button class="blockPanelButton" data-type="if">Условие if</button>
            <button class="blockPanelButton" data-type="if-else">Условие if-else</button>
            <button class="blockPanelButton" data-type="while">Цикл while</button>
            <button class="blockPanelButton" data-type="add">Сложение</button>
            <button class="blockPanelButton" data-type="subtract">Вычитание</button>
            <button class="blockPanelButton" data-type="multiply">Умножение</button>
            <button class="blockPanelButton" data-type="div">Деление</button>
            <button class="blockPanelButton" data-type="mod">Остаток</button>
            <button class="blockPanelButton" data-type="gt">Больше</button>
            <button class="blockPanelButton" data-type="lt">Меньше</button>
            <button class="blockPanelButton" data-type="eq">Равно</button>
            <button class="blockPanelButton" data-type="neq">Не равно</button>
            <button class="blockPanelButton" data-type="gte">Больше или равно</button>
            <button class="blockPanelButton" data-type="lte">Меньше или равно</button>
            <button class="blockPanelButton" data-type="and">И</button>
            <button class="blockPanelButton" data-type="or">ИЛИ</button>
            <button class="blockPanelButton" data-type="not">НЕ</button>
            <button class="blockPanelButton" data-type="arrayDeclare">Новый массив</button>
            <button class="blockPanelButton" data-type="arrayAssignByIndex">Записать в массив</button>
            <button class="blockPanelButton" data-type="arrayGet">Чтение из массива</button>
            <button class="blockPanelButton" data-type="arrayLength">Длина массива</button>
        </section>
        <section class="workSpace">
            <div class="blockWorkSpaceButton">
                <button class="workSpaceButton" data-type="delete"></button>
                <div class="blockButtonDelete">Очистить все</div>
                <button class="workSpaceButton" data-type="run"></button>
                <div class="blockButtonRun">Запустить</div>
            </div>
        </section>
        <section class="outputPanel">
        <h3>Консоль вывода</h3>
        </section>
        </section>

    </main>
    <script src="scripts/data.js"></script>
    <script src="scripts/blockConnections.js"></script>
    <script src="scripts/blockMovement.js"></script>
    <script src="scripts/blockRender.js"></script>
    <script src="scripts/blockSlots.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/interpreter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.11/dist/interact.min.js"></script>

</body>
</html>
